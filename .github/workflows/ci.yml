name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      # Non-blocking for now: the codebase carries pre-existing lint debt
      # (mostly react-hooks/set-state-in-effect on SSR-safe localStorage
      # reads) that predates this workflow. Still runs so output is visible;
      # tighten to a hard gate once that debt is cleaned up.
      - name: Lint
        run: npx eslint .
        continue-on-error: true

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
